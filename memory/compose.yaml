name: popot-memory

services:
  cognee:
    extends:
      file: config.json
      service: cognee
    image: cognee/cognee:${COGNEE_VERSION:?Use bash compose.sh to load pyproject.toml versions}
    environment:
      DEFAULT_USER_PASSWORD: ${COGNEE_PASSWORD:?Run bash memory/up.sh first}
    volumes:
      - cognee-system:/cognee-storage/system
      - cognee-data:/cognee-storage/data
      - ../skills:/app/popot-skills:ro
      # Directory mounts follow atomic editor saves instead of pinning old files.
      - ../config:/app/config:ro
      - ../popot_agents:/app/popot_agents:ro
      - .:/app/popot-sync:ro

  cognee-web:
    extends:
      file: config.json
      service: cognee-web
    image: nginx:${NGINX_VERSION:?Use bash compose.sh to load pyproject.toml versions}
    depends_on:
      cognee:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cognee-ui:
    extends:
      file: config.json
      service: cognee-ui
    image: popot-cognee-ui:${COGNEE_VERSION:?Use bash compose.sh to load pyproject.toml versions}-knowledge
    build:
      context: ./ui
      additional_contexts:
        node-base: docker-image://${NODE_IMAGE:?Use bash compose.sh to load pyproject.toml versions}
        cognee-ui-base: docker-image://cognee/cognee-ui:${COGNEE_VERSION:?Use bash compose.sh to load pyproject.toml versions}
      args:
        COGNEE_COMMIT: ${COGNEE_COMMIT:?Use bash compose.sh to load pyproject.toml versions}
        COGNEE_SOURCE_SHA256: ${COGNEE_SOURCE_SHA256:?Use bash compose.sh to load pyproject.toml versions}
    # Share the gateway's network namespace: both browser and UI server-side
    # graph routes can reach the same authenticated API at localhost:3001.
    network_mode: service:cognee-web
    depends_on:
      cognee-web:
        condition: service_started
    environment:
      DEFAULT_USER_PASSWORD: ${COGNEE_PASSWORD:?Run bash memory/up.sh first}

volumes:
  cognee-system:
  cognee-data:
