map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3001;
    server_name localhost;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/ {
        set $cognee_backend http://cognee:8000;
        proxy_pass $cognee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        # The upstream UI uses localhost for browser API calls and session cookies.
        # Keep UI navigation on that origin even when opened through 127.0.0.1.
        if ($host = 127.0.0.1) {
            return 302 http://localhost:3001$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
