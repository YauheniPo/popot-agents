services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: popot_agents
      POSTGRES_USER: popot
      POSTGRES_PASSWORD: ${POPOT_DB_PASSWORD:?Set POPOT_DB_PASSWORD in .env}
    volumes:
      - ${HOME:?HOME is required}/.popot-agents/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popot -d popot_agents"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker-image:
    image: popot-agent-worker:local
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: ["true"]
    develop:
      watch:
        - action: rebuild
          path: .
          include:
            - docker/worker.Dockerfile
            - .dockerignore
            - popot_agents/__init__.py
            - popot_agents/runtime_config.py
            - popot_agents/tools.py
            - popot_agents/worker/**
            - config/runtime.json

  orchestrator:
    image: popot-orchestrator:local
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      AGENT_SESSION_BACKEND: postgres
      AGENT_LEGACY_SESSION_DIR: /data/legacy-sessions
      PGHOST: db
      PGDATABASE: popot_agents
      PGUSER: popot
      PGPASSWORD: ${POPOT_DB_PASSWORD:?Set POPOT_DB_PASSWORD in .env}
      AGENT_WORKSPACE_DIR: /data/workspaces
      AGENT_WORKSPACE_HOST_DIR: ${HOME:?HOME is required}/.popot-agents/workspaces
    ports:
      - "127.0.0.1:${API_PUBLISH_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.sessions:/data/legacy-sessions:ro
      - ${HOME:?HOME is required}/.popot-agents/workspaces:/data/workspaces
    healthcheck:
      # Task requests block this single-threaded server; check its listening socket.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: .
          include:
            - docker/orchestrator.Dockerfile
            - .dockerignore
            - popot_agents/__init__.py
            - popot_agents/runtime_config.py
            - popot_agents/tools.py
            - popot_agents/orchestrator/**
            - config/**

  mcp-server:
    image: popot-mcp:local
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    depends_on:
      orchestrator:
        condition: service_healthy
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_ORCHESTRATOR_URL: http://orchestrator:8000
    ports:
      - "127.0.0.1:${MCP_PUBLISH_PORT:-8001}:8001"
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: .
          include:
            - docker/mcp.Dockerfile
            - .dockerignore
            - popot_agents/__init__.py
            - popot_agents/runtime_config.py
            - popot_agents/mcp_server.py
            - config/runtime.json
