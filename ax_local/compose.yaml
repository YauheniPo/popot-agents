name: popot-ax-local

services:
  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_VERSION:?Use bash compose.sh to load pyproject.toml versions}
    profiles: [omniroute]
    environment:
      DATA_DIR: /app/data
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-}
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 40s
    restart: unless-stopped

  omniroute-init:
    image: ${PYTHON_IMAGE:?Use bash compose.sh to load pyproject.toml versions}
    profiles: [omniroute]
    depends_on:
      omniroute:
        condition: service_healthy
    environment:
      OMNIROUTE_URL: http://omniroute:20128
      OMNIROUTE_INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python
      - /bootstrap/omniroute.py
      - --config
      - /config/omniroute-settings.json
      - --combos
      - /config/omniroute-combos.json
    volumes:
      - ./omniroute.py:/bootstrap/omniroute.py:ro
      - ../config:/config:ro
    restart: "no"

  db:
    image: postgres:${POSTGRES_VERSION:?Use bash compose.sh to load pyproject.toml versions}
    restart: unless-stopped
    environment:
      POSTGRES_DB: popot_agents_ax
      POSTGRES_USER: popot
      POSTGRES_PASSWORD: ${POPOT_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ax-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popot -d popot_agents_ax"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: popot-ax-api:local
    build:
      context: ..
      dockerfile: ax_local/docker/api.Dockerfile
      additional_contexts:
        python-base: docker-image://${PYTHON_IMAGE:?Use bash compose.sh to load pyproject.toml versions}
        go-base: docker-image://${GO_IMAGE:?Use bash compose.sh to load pyproject.toml versions}
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - kind
    environment:
      AX_LOCAL_API_PORT: 8002
      COGNEE_API_URL: http://cognee:8000
      AX_LOCAL_PGHOST: db
      AX_LOCAL_PGPORT: 5432
      AX_LOCAL_KUBECONFIG: /run/ax-local/kubeconfig
      KUBECONFIG: /run/ax-local/kubeconfig
      AX_LOCAL_WORKER_IMAGE_FILE: /run/ax-local/worker-image
      POPOT_DB_PASSWORD: ${POPOT_DB_PASSWORD:-}
    volumes:
      - type: bind
        source: ./.local/kubeconfig-container
        target: /run/ax-local/kubeconfig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/worker-image
        target: /run/ax-local/worker-image
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; from ax_local.api.provider_proxy import network_address_toward; urllib.request.urlopen('http://' + network_address_toward('db', 5432) + ':8002/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mcp-server:
    image: popot-ax-mcp:local
    build:
      context: ..
      dockerfile: docker/mcp.Dockerfile
      additional_contexts:
        python-base: docker-image://${PYTHON_IMAGE:?Use bash compose.sh to load pyproject.toml versions}
    depends_on:
      api:
        condition: service_healthy
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_ORCHESTRATOR_URL: http://api:8002
    ports:
      - "127.0.0.1:${AX_MCP_PUBLISH_PORT:-8003}:8001"
    restart: unless-stopped

volumes:
  omniroute-data:
  ax-postgres:

networks:
  kind:
    external: true
    name: kind
