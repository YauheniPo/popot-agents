name: Security

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and publish security findings
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  gitguardian:
    name: GitGuardian secret scan
    # API secrets are unavailable to fork PRs and Dependabot. Scheduled scans use CodeQL.
    if: >-
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check GitGuardian key configuration
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo '::error::Set the repository Actions secret GITGUARDIAN_API_KEY.'
            exit 1
          fi
      - name: Scan the checkout for secrets
        # The pinned ggshield action always runs `secret scan ci`, whose SARIF reports
        # `commit://` locations. GitHub code scanning rejects that scheme against a
        # `file://` checkout, so the same pinned image runs path mode instead: findings
        # keep workspace-relative locations and the exit code still gates the job.
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/data" \
            -w /data \
            -e GITGUARDIAN_API_KEY \
            gitguardian/ggshield@sha256:363427689cdd746cf7fa3a4bad2e16b41ad4fa5f7ea5ae262711e13ed456f653 \
            ggshield secret scan path . --recursive --format sarif --output gitguardian.sarif
      - name: Publish GitGuardian findings to Security
        if: ${{ !cancelled() && hashFiles('gitguardian.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitguardian.sarif
          checkout_path: ${{ github.workspace }}
          category: gitguardian
