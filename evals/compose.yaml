name: popot-evals

services:
  phoenix:
    extends:
      file: config.json
      service: phoenix
    image: ${PHOENIX_IMAGE:?Use bash compose.sh to load pyproject.toml versions}
    environment:
      PHOENIX_SECRET: ${PHOENIX_SECRET:?Generate private Phoenix environment first}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:?Generate private Phoenix environment first}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:?Generate private Phoenix environment first}
    volumes:
      - phoenix-data:/data

volumes:
  phoenix-data:
