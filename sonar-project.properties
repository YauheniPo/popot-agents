sonar.host.url=https://sonarcloud.io
sonar.organization=yauhenipo
sonar.projectKey=YauheniPo_popot-agents
sonar.projectName=popot-agents
sonar.sourceEncoding=UTF-8

sonar.sources=popot_agents,ax_local,memory
sonar.tests=tests,ax_local/tests
sonar.exclusions=ax_local/tests/**,**/node_modules/**,**/__pycache__/**,**/.local/**
# The Go helpers are copied into the pinned Substrate tree and tested there;
# this repository cannot collect Go coverage for them.
sonar.coverage.exclusions=ax_local/cluster/cleanup_go/**,ax_local/cluster/gvisor_cleanup_go/**
sonar.python.version=3.10,3.11,3.12
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.javascript.lcov.reportPaths=reports/graph.lcov
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
